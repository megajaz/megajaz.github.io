<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michal Jaz (55789) - AI LAB D</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="wheather-container">
        <h1>Twoja pogoda w twoim internecie &#9924</h1>
        <input type="text" placeholder="Miejscowosc . . ." id="inputCityName">
        <button id="btnGetWheather">Wyszukaj</button>
        <br>
        <p id="city-err"></p>
        <h2>Sprawdź pogodę</h2>

        <div class="weather-info">
            <div class="current">
                <h3>Pogoda teraz</h3>
                <p>Wyszukaj miasto, aby zobaczyć pogodę.</p>
            </div>

            <div class="forecast">
                <h3>Prognoza na najbliższe godziny.</h3>
            </div>
        </div>
        
    </div>
</body>
</html>
